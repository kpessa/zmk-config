#Uncomment the following lines to enable the Corne RGB Underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

#Uncomment the following line to enable the Corne OLED Display
CONFIG_ZMK_DISPLAY=y

# Steno chords need more than the default 6 keys at once
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# Battery: lights start off and only light up on a non-base layer (the layer
# macros send RGB_ON / RGB_OFF). With the lights off ZMK also cuts the LEDs'
# power rail, so they draw nothing. Off after idle too, in case a layer is left on.
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y

# Both halves' battery on the Mac: the left (central) half fetches the right
# half's level and publishes it as a second Battery Service ("Peripheral 0").
# Keyboard Layers reads both over Bluetooth.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
