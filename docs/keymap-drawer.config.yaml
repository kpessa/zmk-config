draw_config:
  key_w: 64
  key_h: 60
  key_rx: 9
  key_ry: 9
  split_gap: 40
  inner_pad_w: 3
  inner_pad_h: 3
  outer_pad_w: 36
  outer_pad_h: 64
  n_columns: 2
  combo_w: 54
  combo_h: 24
  append_colon_to_layer_header: false
  shrink_wide_legends: 6
  footer_text: "Corne · ZMK · generated from config/corne.keymap by ./draw-keymap"
  svg_extra_style: |
    svg.keymap {
        font-family: "SF Pro Rounded", "SF Pro Text", -apple-system, "Helvetica Neue", sans-serif;
        font-size: 17px;
        font-weight: 500;
        fill: #e8eaee;
        background: #14161b;
    }
    rect.key { fill: #242830; stroke: #3a404b; stroke-width: 1.2; }
    text.hold, text.shifted { font-size: 10.5px; font-weight: 600; letter-spacing: .04em; fill: #8d95a3; }
    text.label { font-size: 19px; font-weight: 700; letter-spacing: .02em; stroke: none; }
    tspan.hint { font-size: 12.5px; font-weight: 500; fill: #8d95a3; letter-spacing: 0; }
    text.footer { fill: #5d6573; stroke: none; font-size: 11px; }

    /* pass-through keys: the base-layer letter, ghosted */
    rect.thru { fill: #191c22; stroke: #262a32; }
    text.thru { fill: #4c5361; font-weight: 400; }
    /* keys that do nothing on this layer */
    rect.off { fill: none; stroke: #2a2e37; stroke-dasharray: 3 4; }
    /* the key you are holding to see this layer */
    rect.held { fill: #2c313b; stroke-width: 2; }
    text.held.tap { fill: #8d95a3; }

    /* combos */
    rect.combo { fill: #14161b; stroke-width: 1.5; rx: 12; }
    text.combo { font-size: 11px; font-weight: 700; letter-spacing: .04em; }
    path.combo { stroke: #5d6573; stroke-dasharray: 2 3; }

    /* each layer in its LED colour */
    .layer-Kinesis text.label { fill: #f2f3f5; }
    .layer-Num\/Nav text.label, .layer-Num\/Nav text.held.hold { fill: #6f9bff; }
    .layer-Num\/Nav rect.key:not(.thru):not(.off) { stroke: #3d5fb8; fill: #1f2a44; }
    .layer-Num\/Nav rect.held { stroke: #6f9bff; }
    .layer-Symbols text.label, .layer-Symbols text.held.hold { fill: #ffa04d; }
    .layer-Symbols rect.key:not(.thru):not(.off) { stroke: #a8642a; fill: #3a2a1c; }
    .layer-Symbols rect.held { stroke: #ffa04d; }
    .layer-Fn text.label, .layer-Fn text.held.hold { fill: #b98aff; }
    .layer-Fn rect.key:not(.thru):not(.off) { stroke: #6e4bb0; fill: #2a2140; }
    .layer-Fn rect.held { stroke: #b98aff; }
    .layer-Arrows text.label { fill: #3fd0dc; }
    .layer-Arrows rect.key:not(.thru):not(.off) { stroke: #23808a; fill: #17313a; }
    .layer-Steno text.label { fill: #4fd684; }
    .layer-Kinesis rect.combo, .layer-Steno rect.combo { stroke: #4fd684; }
    .layer-Kinesis text.combo, .layer-Steno text.combo { fill: #4fd684; }
    rect.combo.nav { stroke: #3fd0dc !important; }
    text.combo.nav { fill: #3fd0dc !important; }

    /* steno keys: big steno letter, small QWERTY letter above */
    .layer-Steno text.key.tap { font-size: 22px; font-weight: 700; }
    .layer-Steno text.shifted { font-size: 12px; }
    rect.sl { fill: #1d3350; stroke: #4a82c9; }   text.sl.tap { fill: #a9cdfb; }   text.sl.shifted { fill: #6f9bd0; }
    rect.sr { fill: #1b3a30; stroke: #3fa57a; }   text.sr.tap { fill: #a5ecc9; }   text.sr.shifted { fill: #5fb894; }
    rect.sv { fill: #45351a; stroke: #d19a3c; }   text.sv.tap { fill: #ffd995; }   text.sv.shifted { fill: #c9a05a; }
    rect.sx { fill: #44222a; stroke: #cf5f72; }   text.sx.tap { fill: #ffb3bf; }   text.sx.shifted { fill: #c9788a; }
    rect.sn { fill: #2a2e37; stroke: #596170; }   text.sn.tap { fill: #a7aebb; font-size: 17px; }
